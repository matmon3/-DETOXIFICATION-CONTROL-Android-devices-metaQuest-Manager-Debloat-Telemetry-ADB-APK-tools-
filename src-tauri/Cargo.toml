[package]
name = "aqm"
version = "0.1.0"
description = "Detoxification Control - Android / Quest device control interface"
authors = ["Detoxification Control"]
edition = "2021"

[lib]
name = "aqm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
shlex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
