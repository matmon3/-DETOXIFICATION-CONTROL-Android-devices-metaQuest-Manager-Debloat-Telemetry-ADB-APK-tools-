# Build do DETOXIFICATION CONTROL em cada OS e publicação automática no GitHub Release.
#
# Dispara em tags v* (ex: v0.1.0) ou manualmente (botão "Run workflow").
# Cada job roda numa VM própria daquele SO e anexa os artefatos à Release:
#   - ubuntu-latest   -> AppImage + RPM + DEB
#   - windows-latest  -> MSI + setup.exe (NSIS)
#
# Para publicar: git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles appimage,rpm,deb
          - platform: windows-latest
            args: --bundles msi,nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Detoxification Control ${{ github.ref_name }}"
          releaseBody: |
            Release gerada automaticamente pelo GitHub Actions.
          releaseDraft: true
          args: ${{ matrix.args }}
